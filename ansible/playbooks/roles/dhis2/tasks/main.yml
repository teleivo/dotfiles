---
# https://www.postgresql.org/download/linux/debian/
- name: Download PostgreSQL GPG key
  become: true
  get_url:
    url: "{{ postgresql_gpg_key_url }}"
    dest: /usr/share/keyrings/postgresql.asc
    mode: '0644'
    force: false

- name: Verify PostgreSQL GPG key fingerprint
  command: gpg --show-keys --with-fingerprint /usr/share/keyrings/postgresql.asc
  register: postgresql_gpg_output
  changed_when: false

- name: Check PostgreSQL GPG key fingerprint
  assert:
    that:
      - "postgresql_gpg_key_fingerprint | replace(' ', '') in postgresql_gpg_output.stdout | replace(' ', '')"
    fail_msg: "PostgreSQL GPG key fingerprint verification failed"

- name: Add PostgreSQL apt repository
  become: true
  apt_repository:
    repo: "{{ postgresql_apt_repo }}"
    state: present
    update_cache: true

- name: Mask postgresql service before installing
  become: true
  systemd:
    name: postgresql
    masked: true

# postgresql-common provides pg_virtualenv; python3-venv is for DHIS2 doc generation.
- name: Install packages
  become: true
  apt:
    pkg: "{{ ['postgresql-client',
              'postgresql-common',
              'python3',
              'python3-pip',
              'python3-venv',
              'pgbadger',
              'direnv',
              'stow']
             + (postgresql_versions | map('regex_replace', '^', 'postgresql-') | list) }}"

- name: Ensure postgresql service is disabled (only installed for pg_virtualenv)
  become: true
  systemd:
    name: postgresql
    enabled: false
    state: stopped
    masked: false

# Only pg_virtualenv is used, which creates throw-away clusters in a temp dir.
# Stop future installs (e.g. a new major version) from creating a main cluster.
- name: Prevent creation of default main cluster
  become: true
  lineinfile:
    path: /etc/postgresql-common/createcluster.conf
    regexp: '^\s*#?\s*create_main_cluster\s*='
    line: 'create_main_cluster = false'
    state: present

# pg_dropcluster removes /etc/postgresql/<ver>/main as its last step, so that
# directory's absence is the idempotency guard.
- name: Check for default main clusters
  become: true
  stat:
    path: "/etc/postgresql/{{ item }}/main"
  register: postgresql_main_clusters
  loop: "{{ postgresql_versions }}"

- name: Drop default main clusters (only pg_virtualenv is used)
  become: true
  command: "pg_dropcluster --stop {{ item.item }} main"
  loop: "{{ postgresql_main_clusters.results }}"
  loop_control:
    label: "{{ item.item }}/main"
  when: item.stat.exists

- name: Install IntelliJ IDEA Ultimate
  become: true
  snap:
    name: intellij-idea-ultimate
    classic: yes

- name: Ensure DHIS2 folders exist
  file:
    path: "{{ item }}"
    state: directory
  loop:
    - ~/.local/dhis2
    - ~/code/dhis2/

- name: Clone DHIS2 tooling
  git:
    repo: https://github.com/teleivo/dhis2-tooling
    dest: ~/code/dhis2/tooling
    force: no
    remote: my

- name: Link to d2 docker script
  file:
    src: "{{ lookup('env', 'HOME') }}/code/dhis2/tooling/d2"
    dest: "{{ lookup('env', 'HOME') }}/bin/d2"
    state: link

- name: Link report script to local bin
  file:
    src: ~/code/dhis2/reporting/report
    dest: ~/.local/bin/report
    state: link

- name: Ensure config folders exist
  file:
    path: "{{ item }}"
    state: directory
  loop:
    - ~/.config/JetBrains/IntelliJIdea2025.2
    - ~/.config/pgcli

- name: Create symlinks into dotfiles
  command: stow --target ~/ {{ item }}
  args:
    chdir: ~/code/dotfiles
  loop:
    - intellij
    - psql
  changed_when: false  # command module always shows changed; stow is idempotent, failures still detected via exit code

- include_tasks: sops.yml

- include_tasks: kubectl.yml

- include_tasks: awscli.yml
